<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Community</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f1f8e9;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .header {
            background: #43a047;
            color: white;
            text-align: center;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
        }

        .form-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-container input,
        .form-container button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1.1rem;
        }

        .form-container button {
            background: #43a047;
            color: white;
            font-weight: bold;
            transition: background 0.3s;
        }

        .form-container button:hover {
            background: #388e3c;
        }

        .profile {
            margin-top: 20px;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .profile h3 {
            margin-bottom: 10px;
        }

        .profile .community-link {
            font-size: 1.1rem;
            color: #388e3c;
            word-break: break-word;
        }
    </style>
</head>

<body>
    <header class="header">
        <h1>Join Your Community</h1>
    </header>

    <div class="form-container">
        <label for="community-code">Enter Community Code</label>
        <input type="text" id="community-code" placeholder="Enter 6-letter code" required>
        <button onclick="joinCommunity()">Join Community</button>
    </div>

    <div id="profile" class="profile" style="display: none;">
        <h3>Your Profile</h3>
        <p><strong>Community:</strong> <span id="community-name"></span></p>
        <p><strong>Group Link:</strong> <a id="group-link" href="#" target="_blank">Visit Group</a></p>
    </div>

    <script>
        function joinCommunity() {
            const code = document.getElementById('community-code').value;
            const communityCode = localStorage.getItem('communityCode');

            if (code === communityCode) {
                const communityName = localStorage.getItem('communityName');
                const groupLink = localStorage.getItem('groupLink');

                document.getElementById('community-name').textContent = communityName;
                document.getElementById('group-link').href = groupLink;
                document.getElementById('group-link').textContent = groupLink;

                document.getElementById('profile').style.display = 'block';
            } else {
                alert('Invalid code, please try again.');
            }
        }
    </script>
</body>

</html>
