<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecomate Feedback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        h1 {
            text-align: center;
            color: #2c7a7b;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        textarea {
            resize: vertical;
        }
        button {
            background-color: #2c7a7b;
            color: #fff;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #225d5e;
        }
        .success, .error {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ecomate Feedback</h1>
        <form id="feedback-form">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="feedback">Your Feedback</label>
            <textarea id="feedback" name="feedback" rows="5" placeholder="Enter your feedback here..." required></textarea>

            <button type="submit">Submit Feedback</button>
            <p class="success" id="success-message" style="display: none;">Thank you for your feedback!</p>
            <p class="error" id="error-message" style="display: none;">Something went wrong. Please try again.</p>
        </form>
        <a href = '/home'><button>Home</button></a>
    </div>

    <script>
        document.getElementById('feedback-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const feedback = document.getElementById('feedback').value;

            try {
                const response = await fetch('/submit-feedback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email, feedback }),
                });

                if (response.ok) {
                    const successMessage = document.getElementById('success-message');
                    successMessage.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = '/home';
                    }, 2000);
                } else {
                    throw new Error('Failed to send feedback');
                }
            
            } catch (error) {
                console.error(error);
                document.getElementById('error-message').style.display = 'block';
            }
        });
    </script>
</body>
</html>
