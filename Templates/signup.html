<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Ecomate</title>
    <link rel="stylesheet" href="/static/sign.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <header>
        <img src="/static/images/ecomatelogo.png" alt="Ecomate Logo" class="logo">
    </header>
    <main>
        <div class="signup-container">
            <h2>Create an Account</h2>

            {% if error %}
            <p class="error-message">{{ error }}<a href="{{ url_for('login') }}">Login here</a></p>
            {% endif %}

            <form action="/signup" method="POST">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="signup-button">Sign Up</button>
            </form>
            <p class="login-prompt">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
        </div>
    </main>
</body>
</html>
