<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Ecomate</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <h1>Ecomate</h1>
        <nav>
            <a href="/home">Home</a>
            <a href="/recycling-options">Recycling Options</a>
            <a href="/settings">Settings</a>
            <a href="/community">Community</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <main>
        <h2>Settings</h2>

        <div>
            <label for="theme-toggle">Dark Theme:</label>
            <input type="checkbox" id="theme-toggle">
        </div>
        <script src="/static/theme-toggle.js"></script>
        
        <form>
            <label for="theme">Choose Theme:</label>
            <select id="theme" name="theme">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>

            <label for="notifications">Enable Notifications:</label>
            <input type="checkbox" id="notifications" name="notifications">

            <label for="language">Preferred Language:</label>
            <select id="language" name="language">
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
            </select>

            <button type="submit" class="interactive-button">Save</button>
        </form>
    </main>
</body>
</html>
